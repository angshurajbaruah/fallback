name: Fallback
options:
  bundleIdPrefix: com.angshurajbaruah
  deploymentTarget:
    macOS: "14.0"
packages:
  FallbackCore:
    path: Packages/FallbackCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Fallback:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: FallbackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angshurajbaruah.fallback
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: App/Fallback.entitlements
        DEVELOPMENT_TEAM: YM6Q5VGJZK # Personal Team: stable signature so macOS keeps permissions across rebuilds
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fallback
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Fallback reads the address and title of your browser's current tab when you upload a file, so it can record where the file went. Nothing leaves your Mac."
